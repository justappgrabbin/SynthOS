<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Core-Termux + MCP Screenshot</title>
<style>
:root {
  --bg: #0d1117; --bg-card: #161b22; --bg-hover: #21262d; --border: #30363d;
  --text: #c9d1d9; --text-dim: #8b949e; --accent: #58a6ff; --accent2: #a371f7;
  --accent3: #3fb950; --accent4: #f0883e; --accent5: #f85149;
  --font: 'SF Mono','Fira Code','JetBrains Mono',monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; background:var(--bg); color:var(--text); font-family:var(--font); font-size:13px; overflow:hidden; }
.app { display:flex; height:100vh; width:100vw; }
.sidebar { width:64px; background:var(--bg-card); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:4px; flex-shrink:0; z-index:10; }
.sidebar .logo { width:40px; height:40px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:#fff; margin-bottom:16px; cursor:pointer; }
.nav-item { width:48px; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; color:var(--text-dim); font-size:20px; position:relative; }
.nav-item:hover,.nav-item.active { background:var(--bg-hover); color:var(--accent); }
.nav-label { position:absolute; left:56px; background:var(--bg-hover); color:var(--text); padding:4px 10px; border-radius:6px; font-size:11px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity 0.2s; border:1px solid var(--border); z-index:100; }
.nav-item:hover .nav-label { opacity:1; }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.topbar { height:52px; background:var(--bg-card); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 20px; gap:16px; flex-shrink:0; }
.topbar .title { font-size:15px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:8px; }
.topbar .title .version { font-size:10px; color:var(--text-dim); background:var(--bg-hover); padding:2px 8px; border-radius:4px; }
.search-box { flex:1; max-width:400px; position:relative; }
.search-box input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 12px 8px 32px; color:var(--text); font-family:var(--font); font-size:12px; outline:none; transition:border-color 0.2s; }
.search-box input:focus { border-color:var(--accent); }
.search-box::before { content:"🔍"; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:12px; opacity:0.5; }
.status-bar { display:flex; align-items:center; gap:12px; font-size:11px; color:var(--text-dim); }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(--accent3); box-shadow:0 0 6px var(--accent3); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.status-dot.disconnected { background:var(--accent5); box-shadow:0 0 6px var(--accent5); }
.content { flex:1; overflow-y:auto; padding:20px; scroll-behavior:smooth; }
.content::-webkit-scrollbar { width:6px; }
.content::-webkit-scrollbar-track { background:transparent; }
.content::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.dashboard-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-bottom:20px; }
.card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:16px; transition:all 0.2s; cursor:pointer; }
.card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 20px rgba(88,166,255,0.08); }
.card-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.card-icon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; }
.card-title { font-size:14px; font-weight:600; color:var(--text); }
.card-desc { font-size:12px; color:var(--text-dim); line-height:1.5; margin-bottom:12px; }
.card-meta { display:flex; gap:8px; flex-wrap:wrap; }
.tag { font-size:10px; padding:3px 8px; border-radius:4px; background:var(--bg-hover); color:var(--text-dim); border:1px solid var(--border); }
.tag.installed { background:rgba(63,185,80,0.1); color:var(--accent3); border-color:rgba(63,185,80,0.3); }
.tag.available { background:rgba(88,166,255,0.1); color:var(--accent); border-color:rgba(88,166,255,0.3); }
.section-header { display:flex; align-items:center; justify-content:space-between; margin:24px 0 12px 0; }
.section-title { font-size:13px; font-weight:600; color:var(--text); text-transform:uppercase; letter-spacing:1px; }
.section-count { font-size:11px; color:var(--text-dim); background:var(--bg-hover); padding:2px 8px; border-radius:4px; }
.terminal-panel { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:16px; }
.terminal-header { display:flex; align-items:center; padding:10px 16px; background:var(--bg-hover); border-bottom:1px solid var(--border); gap:8px; }
.term-btn { width:12px; height:12px; border-radius:50%; cursor:pointer; }
.term-btn.red { background:#ff5f56; } .term-btn.yel { background:#ffbd2e; } .term-btn.grn { background:#27c93f; }
.terminal-title { flex:1; text-align:center; font-size:11px; color:var(--text-dim); }
.terminal-body { padding:12px 16px; font-size:12px; line-height:1.6; min-height:200px; max-height:300px; overflow-y:auto; }
.terminal-line { margin-bottom:4px; word-break:break-all; }
.terminal-line .prompt { color:var(--accent3); } .terminal-line .cmd { color:var(--accent); }
.terminal-line .output { color:var(--text-dim); } .terminal-line .error { color:var(--accent5); }
.terminal-line .success { color:var(--accent3); }
.terminal-input-line { display:flex; align-items:center; gap:8px; padding:8px 16px; border-top:1px solid var(--border); }
.terminal-input-line .prompt { color:var(--accent3); font-size:12px; }
.terminal-input-line input { flex:1; background:transparent; border:none; color:var(--text); font-family:var(--font); font-size:12px; outline:none; }
.tool-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
.tool-item { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px; transition:all 0.2s; }
.tool-item:hover { border-color:var(--accent); }
.tool-item-header { display:flex; align-items:center; gap:10px; }
.tool-item-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; }
.tool-item-name { font-size:13px; font-weight:600; }
.tool-item-desc { font-size:11px; color:var(--text-dim); line-height:1.4; }
.tool-item-actions { display:flex; gap:8px; margin-top:4px; }
.btn { padding:6px 14px; border-radius:6px; font-family:var(--font); font-size:11px; cursor:pointer; border:1px solid var(--border); background:var(--bg-hover); color:var(--text); transition:all 0.2s; display:flex; align-items:center; gap:6px; }
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.primary:hover { background:#79b8ff; }
.btn.danger { background:rgba(248,81,73,0.1); color:var(--accent5); border-color:rgba(248,81,73,0.3); }
.btn.danger:hover { background:rgba(248,81,73,0.2); }
.btn.success { background:rgba(63,185,80,0.1); color:var(--accent3); border-color:rgba(63,185,80,0.3); }
.brain-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.brain-editor { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.brain-editor-header { padding:12px 16px; background:var(--bg-hover); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; }
.brain-editor textarea { width:100%; min-height:300px; background:var(--bg-card); border:none; padding:16px; color:var(--text); font-family:var(--font); font-size:12px; line-height:1.6; outline:none; resize:vertical; }
.brain-sidebar { display:flex; flex-direction:column; gap:12px; }
.brain-stat { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:16px; }
.brain-stat-value { font-size:28px; font-weight:700; color:var(--accent); }
.brain-stat-label { font-size:11px; color:var(--text-dim); margin-top:4px; }
.memory-list { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; overflow:hidden; flex:1; }
.memory-list-header { padding:12px 16px; background:var(--bg-hover); border-bottom:1px solid var(--border); font-size:12px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
.memory-item { padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.2s; }
.memory-item:hover { background:var(--bg-hover); }
.memory-item-title { font-size:12px; font-weight:600; color:var(--text); }
.memory-item-meta { font-size:10px; color:var(--text-dim); margin-top:4px; display:flex; gap:8px; }
.voice-panel { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:40px; min-height:300px; }
.voice-circle { width:120px; height:120px; border-radius:50%; border:3px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:48px; cursor:pointer; transition:all 0.3s; position:relative; }
.voice-circle:hover { border-color:var(--accent); }
.voice-circle.listening { border-color:var(--accent5); animation:voice-pulse 1s infinite; }
@keyframes voice-pulse { 0%{box-shadow:0 0 0 0 rgba(248,81,73,0.4)} 70%{box-shadow:0 0 0 20px rgba(248,81,73,0)} 100%{box-shadow:0 0 0 0 rgba(248,81,73,0)} }
.voice-text { font-size:14px; color:var(--text-dim); text-align:center; }
.voice-agents { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.env-table { width:100%; border-collapse:collapse; font-size:12px; }
.env-table th { text-align:left; padding:10px 16px; background:var(--bg-hover); border-bottom:1px solid var(--border); color:var(--text-dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; }
.env-table td { padding:12px 16px; border-bottom:1px solid var(--border); color:var(--text); }
.env-table tr:hover td { background:var(--bg-hover); }
.env-value { font-family:var(--font); color:var(--accent2); background:var(--bg); padding:4px 8px; border-radius:4px; font-size:11px; }
.env-value.hidden { color:var(--text-dim); letter-spacing:2px; }
.screenshot-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.screenshot-item { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; overflow:hidden; cursor:pointer; transition:all 0.2s; }
.screenshot-item:hover { border-color:var(--accent); transform:scale(1.02); }
.screenshot-item img { width:100%; height:140px; object-fit:cover; background:var(--bg); }
.screenshot-item-info { padding:10px 12px; font-size:11px; }
.screenshot-item-name { font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.screenshot-item-date { color:var(--text-dim); margin-top:4px; }
.screenshot-panel { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
.screenshot-tabs { display:flex; gap:8px; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:12px; }
.screenshot-tab { padding:8px 16px; border-radius:6px; cursor:pointer; font-size:12px; color:var(--text-dim); transition:all 0.2s; border:1px solid transparent; }
.screenshot-tab:hover { color:var(--text); }
.screenshot-tab.active { background:var(--bg-hover); color:var(--accent); border-color:var(--border); }
.screenshot-form { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.screenshot-form label { display:block; font-size:11px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
.screenshot-form input,.screenshot-form select { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 14px; color:var(--text); font-family:var(--font); font-size:12px; outline:none; }
.screenshot-form input:focus,.screenshot-form select:focus { border-color:var(--accent); }
.screenshot-preview { margin-top:16px; border:1px dashed var(--border); border-radius:10px; min-height:200px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:12px; }
.screenshot-preview img { max-width:100%; max-height:400px; border-radius:8px; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:1000; backdrop-filter:blur(4px); }
.modal-overlay.active { display:flex; }
.modal { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; width:90%; max-width:600px; max-height:80vh; overflow:hidden; animation:modal-in 0.3s ease; }
@keyframes modal-in { from{opacity:0;transform:scale(0.95) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
.modal-header { padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-title { font-size:15px; font-weight:600; }
.modal-close { cursor:pointer; font-size:18px; color:var(--text-dim); }
.modal-close:hover { color:var(--text); }
.modal-body { padding:20px; }
.modal-body label { display:block; font-size:11px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
.modal-body input,.modal-body select,.modal-body textarea { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 14px; color:var(--text); font-family:var(--font); font-size:12px; outline:none; margin-bottom:16px; }
.modal-body input:focus,.modal-body select:focus,.modal-body textarea:focus { border-color:var(--accent); }
.modal-footer { padding:16px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
.toast-container { position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:1001; }
.toast { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:12px 16px; display:flex; align-items:center; gap:10px; animation:toast-in 0.3s ease; max-width:320px; box-shadow:0 4px 20px rgba(0,0,0,0.3); }
@keyframes toast-in { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
.toast-icon { font-size:18px; } .toast-text { font-size:12px; }
.toast.success { border-color:rgba(63,185,80,0.3); } .toast.error { border-color:rgba(248,81,73,0.3); } .toast.info { border-color:rgba(88,166,255,0.3); }
.mcp-status { display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:6px; background:var(--bg-hover); border:1px solid var(--border); font-size:11px; }
.mcp-status.online { border-color:rgba(63,185,80,0.3); color:var(--accent3); }
.mcp-status.offline { border-color:rgba(248,81,73,0.3); color:var(--accent5); }
@media(max-width:768px) { .sidebar{width:52px} .nav-item{width:40px;height:40px;font-size:16px} .dashboard-grid{grid-template-columns:1fr} .brain-grid{grid-template-columns:1fr} .tool-list{grid-template-columns:1fr} .screenshot-grid{grid-template-columns:repeat(2,1fr)} .topbar{padding:0 12px;gap:8px} .search-box{max-width:200px} .content{padding:12px} }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.fade-in { animation:fadeIn 0.3s ease; }
.terminal-body::-webkit-scrollbar { width:4px; } .terminal-body::-webkit-scrollbar-track { background:transparent; } .terminal-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="logo" onclick="showView('dashboard')">C</div>
    <div class="nav-item active" onclick="showView('dashboard')" data-view="dashboard"><span>🏠</span><span class="nav-label">Dashboard</span></div>
    <div class="nav-item" onclick="showView('modules')" data-view="modules"><span>📦</span><span class="nav-label">Modules</span></div>
    <div class="nav-item" onclick="showView('ai')" data-view="ai"><span>🤖</span><span class="nav-label">AI Agents</span></div>
    <div class="nav-item" onclick="showView('brain')" data-view="brain"><span>🧠</span><span class="nav-label">Brain</span></div>
    <div class="nav-item" onclick="showView('screenshot')" data-view="screenshot"><span>📸</span><span class="nav-label">Screenshot</span></div>
    <div class="nav-item" onclick="showView('voice')" data-view="voice"><span>🎙️</span><span class="nav-label">Voice</span></div>
    <div class="nav-item" onclick="showView('env')" data-view="env"><span>⚙️</span><span class="nav-label">Environment</span></div>
    <div class="nav-item" onclick="showView('terminal')" data-view="terminal"><span>💻</span><span class="nav-label">Terminal</span></div>
    <div style="flex:1"></div>
    <div class="nav-item" onclick="showView('settings')" data-view="settings"><span>🔧</span><span class="nav-label">Settings</span></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="title"><span id="page-title">Core-Termux</span><span class="version">v1.0.0 + MCP</span></div>
      <div class="search-box"><input type="text" placeholder="Search..." id="global-search"></div>
      <div class="status-bar">
        <div class="mcp-status offline" id="mcp-status"><span id="mcp-dot" style="width:8px;height:8px;border-radius:50%;background:var(--accent5);display:inline-block;"></span><span id="mcp-text">MCP Offline</span></div>
        <span class="status-dot" id="conn-dot"></span><span id="conn-text">Connecting...</span><span id="clock">--:--</span>
      </div>

</div>

  <div class="modal" id="modal-content">
    <div class="modal-header"><span class="modal-title" id="modal-title">Title</span><span class="modal-close" onclick="closeModal()">✕</span></div>

    <div class="modal-footer" id="modal-footer"></div>
  </div>

<script>
// ==================== WEBSOCKET ====================
let ws = null, wsConnected = false;
function connectWebSocket() {
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${window.location.host}`);
  ws.onopen = () => {
    wsConnected = true;
    document.getElementById('conn-dot').classList.remove('disconnected');
    document.getElementById('conn-text').textContent = 'Connected';
    document.getElementById('mcp-status').className = 'mcp-status online';
    document.getElementById('mcp-dot').style.background = 'var(--accent3)';
    document.getElementById('mcp-text').textContent = 'MCP Online';
    showToast('WebSocket connected', 'success');
  };
  ws.onclose = () => {
    wsConnected = false;
    document.getElementById('conn-dot').classList.add('disconnected');
    document.getElementById('conn-text').textContent = 'Disconnected';
    document.getElementById('mcp-status').className = 'mcp-status offline';
    document.getElementById('mcp-dot').style.background = 'var(--accent5)';
    document.getElementById('mcp-text').textContent = 'MCP Offline';
    setTimeout(connectWebSocket, 3000);
  };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'screenshot-result') handleScreenshotResult(msg.result);
    else if (msg.type === 'terminal') addTerminalLine(msg.data.text, msg.data.type);
    else if (msg.type === 'module-update') updateModuleStatus(msg.module, msg.tool, msg.installed);
    else if (msg.type === 'error') showToast(msg.message, 'error');
  };
}
function wsSend(data) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(data)); }

// ==================== API ====================
async function apiGet(path) { const res = await fetch(path); return res.json(); }
async function apiPost(path, body) {
  const res = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  return res.json();
}

// ==================== DATA ====================
let modules = {}, envVars = [], memories = [], screenshots = [], terminalLines = [], currentView = 'dashboard';

// ==================== VIEWS ====================
async function showView(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-view="${view}"]`)?.classList.add('active');
  const content = document.getElementById('content-area');
  content.innerHTML = ''; content.className = 'content fade-in';
  const titles = { dashboard:'Core-Termux', modules:'Modules', ai:'AI Agents', brain:'Second Brain', screenshot:'Screenshot MCP', voice:'Voice Commands', env:'Environment Variables', terminal:'Terminal', settings:'Settings' };
  document.getElementById('page-title').textContent = titles[view] || 'Core-Termux';
  switch(view) {
    case 'dashboard': await renderDashboard(); break;
    case 'modules': await renderModules(); break;
    case 'ai': await renderAI(); break;
    case 'brain': await renderBrain(); break;
    case 'screenshot': await renderScreenshot(); break;
    case 'voice': renderVoice(); break;
    case 'env': await renderEnv(); break;
    case 'terminal': renderTerminal(); break;
    case 'settings': renderSettings(); break;
  }
}

async function renderDashboard() {
  try { modules = await apiGet('/api/modules'); } catch(e) {}
  const content = document.getElementById('content-area');
  let html = '<div class="dashboard-grid">';
  Object.entries(modules).forEach(([key, mod]) => {
    const installed = mod.tools.filter(t => t.installed).length;
    const total = mod.tools.length;

async function captureWebScreenshot(opts = {}) {
  const data = { url: document.getElementById('ss-url').value, width: parseInt(document.getElementById('ss-width').value) || 1920, height: parseInt(document.getElementById('ss-height').value) || 1080, fullPage: opts.fullPage || document.getElementById('ss-fullpage').value === 'true', waitForTimeout: parseInt(document.getElementById('ss-wait').value) || 0, selector: document.getElementById('ss-selector').value || undefined };

    const result = wsConnected ? await new Promise((resolve, reject) => { const handler = (e) => { const msg = JSON.parse(e.data); if (msg.type === 'screenshot-result') { ws.removeEventListener('message', handler); resolve(msg.result); } }; ws.addEventListener('message', handler); wsSend({ type: 'screenshot-web', data }); setTimeout(() => reject(new Error('Timeout')), 30000); }) : await apiPost('/api/screenshot/web', data);
    handleScreenshotResult(result);
  } catch (err) { showToast('Capture failed: ' + err.message, 'error'); }
}

async function captureSystemScreenshot() {

    handleScreenshotResult(result);

}

async function captureDashboardScreenshot(opts = {}) {

function handleTerminalInput(e) {
  if (e.key !== 'Enter') return;
  const input = e.target, cmd = input.value.trim();
  if (!cmd) return;
  addTerminalLine(cmd, 'prompt'); input.value = '';
  wsSend({ type: 'command', command: cmd });
  setTimeout(() => {
    if (cmd === 'core --version') addTerminalLine('1.0.0 + MCP Screenshot', 'output');
    else if (cmd === 'help') addTerminalLine('Available: core install, core brain, core env, core voice, core pg, screenshot, clear, help', 'output');
    else if (cmd === 'clear') { terminalLines = []; renderTerminal(); }
    else if (cmd === 'screenshot') addTerminalLine('Use the Screenshot tab for MCP capture tools', 'output');
    else if (cmd.startsWith('core install')) addTerminalLine('Installing... ✔ Complete', 'success');
    else addTerminalLine(`Executed: ${cmd}`, 'output');
    scrollTerminal();
  }, 300);
}

function addTerminalLine(text, type) {
  terminalLines.push({ type, text });
  if (currentView === 'terminal') {
    const body = document.getElementById('terminal-body');
    if (body) { const line = document.createElement('div'); line.className = 'terminal-line'; if (type === 'prompt') line.innerHTML = `<span class="prompt">$</span> <span class="cmd">${text}</span>`; else if (type === 'error') line.innerHTML = `<span class="error">${text}</span>`; else if (type === 'success') line.innerHTML = `<span class="success">${text}</span>`; else line.innerHTML = `<span class="output">${text.replace(/\n/g, '<br>')}</span>`; body.appendChild(line); scrollTerminal(); }
  }
  if (currentView === 'dashboard') renderDashboard();
}
function scrollTerminal() { const body = document.getElementById('terminal-body'); if (body) body.scrollTop = body.scrollHeight; }
function clearTerminal() { terminalLines = []; if (currentView === 'terminal') renderTerminal(); else renderDashboard(); showToast('Terminal cleared', 'info'); }

async function installTool(moduleKey, toolFlag) {
  try {
    const result = await apiPost(`/api/modules/${moduleKey}/${toolFlag}`, { action: 'install' });
    if (result.success) { showToast(result.message, 'success'); addTerminalLine(`core install ${moduleKey} --${toolFlag}`, 'prompt'); addTerminalLine(result.message, 'success'); showModuleDetail(moduleKey); }
  } catch(e) { showToast('Install failed', 'error'); }
}
async function uninstallTool(moduleKey, toolFlag) {
  try {
    const result = await apiPost(`/api/modules/${moduleKey}/${toolFlag}`, { action: 'uninstall' });
    if (result.success) { showToast(result.message, 'info'); addTerminalLine(`core uninstall ${moduleKey} --${toolFlag}`, 'prompt'); addTerminalLine(result.message, 'success'); showModuleDetail(moduleKey); }
  } catch(e) { showToast('Uninstall failed', 'error'); }
}
async function installModule(key) {
  try {
    const mod = modules[key];
    for (const tool of mod.tools) { if (!tool.installed) await apiPost(`/api/modules/${key}/${tool.flag}`, { action: 'install' }); }
    showToast(`${mod.name} module installed`, 'success');
    showModuleDetail(key);
  } catch(e) { showToast('Install failed', 'error'); }
}
function updateModuleStatus(moduleKey, toolFlag, installed) {
  if (modules[moduleKey]) { const tool = modules[moduleKey].tools.find(t => t.flag === toolFlag); if (tool) tool.installed = installed; }
}

function saveMemory() {
  const text = document.getElementById('brain-text').value;
  if (!text.trim()) { showToast('Memory content is empty', 'error'); return; }
  apiPost('/api/brain', { title: 'New Memory', category: 'general', tags: ['new'], content: text }).then(() => {
    showToast('Memory saved', 'success'); addTerminalLine('core brain save', 'prompt'); addTerminalLine('Memory saved to general/', 'success'); renderBrain();
  });
}
function syncBrain() { showToast('Syncing brain to GitHub...', 'info'); setTimeout(() => showToast('Brain synced', 'success'), 1500); }
function newMemory() { document.getElementById('brain-text')?.focus(); showToast('Fill in editor and click Save', 'info'); }
function showMemory(slug) { showToast(`Opening memory: ${slug}`, 'info'); }

function newEnvVar() { openModal('New Environment Variable', `<label>Variable Name</label><input type="text" id="env-name" placeholder="e.g. API_KEY"><label>Value</label><input type="password" id="env-value" placeholder="Enter value"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="env-hidden" checked style="width:auto;"><span>Hide value (sensitive)</span></label>`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEnvVar()">Save Variable</button>`); }
function saveEnvVar() {
  const name = document.getElementById('env-name').value, value = document.getElementById('env-value').value, hidden = document.getElementById('env-hidden').checked;
  if (name && value) { apiPost('/api/env', { name, value, hidden }).then(() => { showToast(`Variable ${name} saved`, 'success'); closeModal(); renderEnv(); }); }
}
function editEnvVar(index) { const v = envVars[index]; openModal('Edit Environment Variable', `<label>Variable Name</label><input type="text" id="env-name" value="${v.name}" readonly><label>Value</label><input type="${v.hidden ? 'password' : 'text'}" id="env-value" value="${v.value}">`, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="updateEnvVar(${index})">Update</button>`); }
function updateEnvVar(index) { apiPost('/api/env', { name: envVars[index].name, value: document.getElementById('env-value').value, hidden: envVars[index].hidden }).then(() => { showToast('Variable updated', 'success'); closeModal(); renderEnv(); }); }
function deleteEnvVar(index) { apiPost('/api/env', { name: envVars[index].name, _delete: true }).then(() => { envVars.splice(index, 1); showToast('Variable deleted', 'info'); renderEnv(); }); }

function openModal(title, body, footer) { document.getElementById('modal-title').textContent = title; document.getElementById('modal-body').innerHTML = body; document.getElementById('modal-footer').innerHTML = footer; document.getElementById('modal').classList.add('active'); }
function closeModal() { document.getElementById('modal').classList.remove('active'); }
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div'); toast.className = `toast ${type}`;
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span class="toast-text">${message}</span>`;
  container.appendChild(toast); setTimeout(() => toast.remove(), 3000);
}
function checkUpdate() { showToast('Checking for updates...', 'info'); setTimeout(() => showToast('You are on the latest version (1.0.0)', 'success'), 1200); }

function updateClock() { const now = new Date(); document.getElementById('clock').textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0'); }
setInterval(updateClock, 1000); updateClock();

connectWebSocket();
showView('dashboard');
</script>
</body>
</html>
